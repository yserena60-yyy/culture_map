<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle (wax seal) -->
  <circle cx="96" cy="96" r="90" fill="#8B4545"/>

  <!-- Border ring -->
  <circle cx="96" cy="96" r="90" fill="none" stroke="#D4C5B0" stroke-width="6"/>
  <circle cx="96" cy="96" r="75" fill="none" stroke="#D4C5B0" stroke-width="2" opacity="0.5"/>

  <!-- Compass needle pointing north (gold) -->
  <g transform="translate(96, 96)">
    <!-- North needle (gold) -->
    <path d="M 0,-45 L -8,15 L 8,15 Z" fill="#D4AF37"/>
    <!-- South needle (darker) -->
    <path d="M 0,45 L -8,-15 L 8,-15 Z" fill="#6B5D4F"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="8" fill="#F5EFE6" stroke="#3D3027" stroke-width="2"/>
  </g>

  <!-- Decorative notches around edge -->
  <g opacity="0.3">
    <line x1="96" y1="10" x2="96" y2="25" stroke="#F5EFE6" stroke-width="3"/>
    <line x1="182" y1="96" x2="167" y2="96" stroke="#F5EFE6" stroke-width="3"/>
    <line x1="96" y1="182" x2="96" y2="167" stroke="#F5EFE6" stroke-width="3"/>
    <line x1="10" y1="96" x2="25" y2="96" stroke="#F5EFE6" stroke-width="3"/>
  </g>
</svg>
